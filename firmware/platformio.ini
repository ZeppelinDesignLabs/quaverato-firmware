; PlatformIO build for Quaverato (MiniCore ATmega328P, 16 MHz, no bootloader)
; Open the firmware/ folder (this file's directory), not the repo root.
; src_dir is a [platformio] option — it is ignored inside [env:*].
[platformio]
src_dir = Quaverato
default_envs = quaverato

[env:quaverato]
platform = atmelavr
board = ATmega328P
framework = arduino
board_build.f_cpu = 16000000L
board_hardware.oscillator = external
board_hardware.bod = 2.7v
board_hardware.uart = no_bootloader
board_build.variant = standard

; _TASK_MICRO_RES is already #defined in the sketch — do not also -D it here
; (that produces a "redefined" warning that looks like a failure).

lib_deps =
  arkhipenko/TaskScheduler@4.0.8
  fortyseveneffects/MIDI Library@5.0.2

upload_protocol = usbtiny
; PIO's Upload target passes avrdude -D (disable auto-erase). Without an
; erase, leftover 0-bits from the previous image stay, verify fails, and
; the pedal is dead. -e forces a chip erase first (EESAVE keeps EEPROM on
; a stock Quaverato). Do not add -V — that hides a bad write.
upload_flags =
  -e
  -B8
